name = "adhan-alexa"
main = "src/index.js"
compatibility_date = "2026-11-01"

# Check every minute
[triggers]
crons = ["* * * * *"]

[vars]
# Main source: DUWT's own timetable on my-masjid.com (begin/adhan times).
# Leave empty to use the Aladhan calculation below instead.
MASJID_GUID = "7a036d31-b4ac-44f6-a68e-2dbb1f7a7994"

# Fallback (used only if the mosque timetable is unavailable)
# Dagenham, London
LATITUDE = "51.5406"
LONGITUDE = "0.1475"
TIMEZONE = "Europe/London"

# 15 = Moonsighting Committee (common in UK). Others: 3 = MWL, 2 = ISNA, 1 = Karachi
METHOD = "15"
# 1 = Hanafi Asr (later), 0 = Shafi'i/standard
SCHOOL = "1"
# 3 = Angle-based high-latitude adjustment (helps Fajr/Isha in UK summer)
LAT_ADJ = "3"

# Minute adjustments to match your mosque, in this order:
# Imsak,Fajr,Sunrise,Dhuhr,Asr,Maghrib,Sunset,Isha,Midnight
# Example: Isha +2 and Maghrib +1 -> "0,0,0,0,0,1,0,2,0"
# Matched to DUWT (duwt.org) begin times on 20-11-2026
TUNE = "0,-6,0,5,0,4,0,7,0"

# Mosques served to apps by /mosques.json and /times.json (a JSON array).
# id: short name used in app URLs. guid: the mosque's my-masjid.com ID (never shown to apps).
MOSQUES = '[{"id":"duwt","name":"Dagenham Ummah Welfare Trust","city":"Dagenham","guid":"7a036d31-b4ac-44f6-a68e-2dbb1f7a7994","timezone":"Europe/London"}]'

# Your Voice Monkey Routine Trigger device ID (from the Voice Monkey console)
DEVICE = "adhan-4wkbn"
# Optional: a separate trigger for Fajr. Leave empty to use DEVICE for all 5.
FAJR_DEVICE = "fajr-h2cta"

# Secrets (set with wrangler, NOT here):
#   npx wrangler secret put VM_TOKEN     -> your Voice Monkey API token
#   npx wrangler secret put TEST_KEY     -> any password, for the ?test=1 link

# KV storage for the app API's mosque timetables. No id needed: on your first
# `npx wrangler deploy`, Wrangler creates the KV namespace in your own
# Cloudflare account automatically. Alexa works with or without it.
[[kv_namespaces]]
binding = "TIMES"
